<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apple Newsroom CSS Extractor</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: #f5f5f7;
        }
        h1 {
            color: #1d1d1f;
            margin-bottom: 30px;
        }
        .section {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .section h2 {
            color: #1d1d1f;
            margin-top: 0;
            font-size: 24px;
            border-bottom: 2px solid #0071e3;
            padding-bottom: 10px;
        }
        .property {
            display: grid;
            grid-template-columns: 200px 1fr;
            gap: 10px;
            padding: 8px 0;
            border-bottom: 1px solid #e8e8ed;
        }
        .property:last-child {
            border-bottom: none;
        }
        .property-name {
            font-weight: 600;
            color: #6e6e73;
        }
        .property-value {
            font-family: 'Monaco', 'Courier New', monospace;
            color: #1d1d1f;
            word-break: break-all;
        }
        #status {
            background: #0071e3;
            color: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }
        button {
            background: #0071e3;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin: 10px 5px;
        }
        button:hover {
            background: #0077ed;
        }
        #iframe-container {
            display: none;
        }
    </style>
</head>
<body>
    <h1>🎨 Apple Newsroom CSS Typography Extractor</h1>
    
    <div id="status">Нажмите кнопку ниже, чтобы извлечь CSS значения</div>
    
    <button onclick="extractCSS()">Извлечь CSS значения</button>
    <button onclick="copyToClipboard()">Копировать в буфер обмена</button>
    
    <div id="results"></div>
    
    <div id="iframe-container">
        <iframe id="apple-frame" src="https://www.apple.com/newsroom/" width="100%" height="600"></iframe>
    </div>

    <script>
        let cssData = {};

        function extractCSS() {
            const status = document.getElementById('status');
            status.textContent = 'Извлечение CSS значений...';
            
            // Открываем iframe
            const container = document.getElementById('iframe-container');
            container.style.display = 'block';
            
            const iframe = document.getElementById('apple-frame');
            
            // Ждем загрузки iframe
            iframe.onload = function() {
                try {
                    const doc = iframe.contentDocument || iframe.contentWindow.document;
                    const body = doc.body;
                    
                    cssData = {
                        body: extractElementStyles(body, ['fontFamily', 'fontSize', 'lineHeight', 'color', 'backgroundColor']),
                        navigationLinks: extractElementStyles(doc.querySelector('nav[aria-label="Global"] a'), ['fontSize', 'fontWeight', 'letterSpacing', 'color', 'fontFamily']),
                        newsCardTitles: extractElementStyles(doc.querySelector('.section-content a h3, article h3'), ['fontSize', 'fontWeight', 'lineHeight', 'letterSpacing', 'color', 'fontFamily']),
                        categoryLabels: extractElementStyles(doc.querySelector('.tile__category, .label'), ['fontSize', 'fontWeight', 'color', 'textTransform', 'letterSpacing', 'fontFamily']),
                        dates: extractElementStyles(doc.querySelector('.tile__date, time'), ['fontSize', 'fontWeight', 'color', 'fontFamily']),
                        pageBackground: { backgroundColor: getComputedStyle(body).backgroundColor },
                        cardBackground: extractElementStyles(doc.querySelector('.tile, article'), ['backgroundColor']),
                        descriptionText: extractElementStyles(doc.querySelector('.tile__description, p'), ['fontSize', 'lineHeight', 'color', 'fontFamily'])
                    };
                    
                    displayResults();
                    status.textContent = 'Извлечение завершено!';
                    status.style.background = '#34c759';
                    
                    // Скрываем iframe после извлечения
                    setTimeout(() => {
                        container.style.display = 'none';
                    }, 1000);
                    
                } catch (e) {
                    status.textContent = 'Ошибка: ' + e.message + ' (возможно, CORS блокировка)';
                    status.style.background = '#ff3b30';
                    console.error(e);
                }
            };
        }

        function extractElementStyles(element, properties) {
            if (!element) return { error: 'Element not found' };
            
            const styles = getComputedStyle(element);
            const result = {};
            
            properties.forEach(prop => {
                result[prop] = styles[prop];
            });
            
            return result;
        }

        function displayResults() {
            const resultsDiv = document.getElementById('results');
            let html = '';
            
            Object.keys(cssData).forEach(section => {
                html += `<div class="section">
                    <h2>${formatSectionName(section)}</h2>`;
                
                const data = cssData[section];
                Object.keys(data).forEach(prop => {
                    html += `<div class="property">
                        <div class="property-name">${formatPropertyName(prop)}</div>
                        <div class="property-value">${data[prop]}</div>
                    </div>`;
                });
                
                html += '</div>';
            });
            
            resultsDiv.innerHTML = html;
        }

        function formatSectionName(name) {
            const names = {
                body: '📄 Body / Page',
                navigationLinks: '🔗 Navigation Links',
                newsCardTitles: '📰 News Card Titles',
                categoryLabels: '🏷️ Category Labels',
                dates: '📅 Dates',
                pageBackground: '🎨 Page Background',
                cardBackground: '🃏 Card Background',
                descriptionText: '📝 Description Text'
            };
            return names[name] || name;
        }

        function formatPropertyName(name) {
            return name.replace(/([A-Z])/g, '-$1').toLowerCase();
        }

        function copyToClipboard() {
            const text = JSON.stringify(cssData, null, 2);
            navigator.clipboard.writeText(text).then(() => {
                alert('CSS данные скопированы в буфер обмена!');
            }).catch(err => {
                console.error('Ошибка копирования:', err);
            });
        }

        // Альтернативный метод: извлечение напрямую из текущей страницы
        function extractFromCurrentPage() {
            window.open('https://www.apple.com/newsroom/', '_blank');
            alert('Откройте консоль разработчика (F12) на странице Apple Newsroom и выполните следующий код:\n\n' + getExtractionScript());
        }

        function getExtractionScript() {
            return `
const extractStyles = (el, props) => {
    if (!el) return { error: 'Not found' };
    const s = getComputedStyle(el);
    const r = {};
    props.forEach(p => r[p] = s[p]);
    return r;
};

const data = {
    body: extractStyles(document.body, ['fontFamily', 'fontSize', 'lineHeight', 'color', 'backgroundColor']),
    navLinks: extractStyles(document.querySelector('nav[aria-label="Global"] a'), ['fontSize', 'fontWeight', 'letterSpacing', 'color']),
    cardTitles: extractStyles(document.querySelector('.section-content a h3'), ['fontSize', 'fontWeight', 'lineHeight', 'letterSpacing', 'color']),
    categoryLabels: extractStyles(document.querySelector('.tile__category'), ['fontSize', 'fontWeight', 'color', 'textTransform', 'letterSpacing']),
    dates: extractStyles(document.querySelector('.tile__date'), ['fontSize', 'fontWeight', 'color']),
    descriptions: extractStyles(document.querySelector('.tile__description'), ['fontSize', 'lineHeight', 'color'])
};

console.log(JSON.stringify(data, null, 2));
            `;
        }
    </script>
</body>
</html>
